      - 未取得签署版保证合同和授权文件时，必须保留“不得表述为保证责任已生效”的声明。
    forbidden:
      - 不得把拟议保证表述为已生效责任，不得推断保证人代偿能力。
    input_contract:
      fact_keys: [guarantor_name, guarantee_scope, guarantee_period, guarantee_cap, bond_issue_amount]
      metric_keys: [guarantee_to_equity]
      rule_keys: [guarantee_scope]
      source_kinds: [募集说明书, 担保合同, 法律意见]
      max_evidence_items: 12
      max_evidence_chars: 18000
    output_contract:
      required_phrases: [拟议, 未取得签署版保证合同]
      required_missing_markers: [材料不足, 未生效]
      forbidden_patterns: [保证责任已经生效]
      attribution_mode: guarantee
    narrative_contract:
      tone: professional_due_diligence
      paragraph_order: [拟议保证结构, 保证范围与期间, 合同状态及核验边界]
      min_paragraphs: 3
      max_paragraphs: 4
      preferred_min_chars: 380
      preferred_max_chars: 1300
      list_mode: prohibited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
