  guarantee:
    llm: true
    generation_mode: generate
    recommendation_mode: structured
    role: 保证责任审查员
    goal: 核验拟议保证人、保证范围、保证期间和责任上限，并标注合同状态。
    required_inputs: [guarantee_facts, sources]
    required_sections: [拟议保证结构, 范围与期间, 合同状态与核验边界]
