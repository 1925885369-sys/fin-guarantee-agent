version: "3.6.0"
global_rules:
  missing_data: 缺失信息必须明确写“材料不足”或“无法判断”，不得以零值或模型推断替代。
  conflict: 募集说明书、评级报告、审计和合同存在冲突时必须并列展示全部来源，不得自动选值或据此形成确定结论。
  evidence: 每个事实、数字、风险和条件必须引用允许来源中的 PDF 页码、Word 段落或 Excel 区域；只能陈述允许来源与冻结记录中实际存在的内容，不得伪造来源或核验结果，不得错配主体、期间、单位及口径，不得把预测、建议或未决事项写成已确认事实。
  calculations: 常用指标由系统预计算，可直接引用；计算模式允许时可依据冻结记录自主计算，并在 calculations 中给出名称、定义、公式与输入记录 ID，由系统复算后采用；不得凭空增加增长假设、折扣率或调整值，不得做预测模型。
  decisions: 可输出承保、拒保、担保额度与担保费率的建议，但须标为待人工复核的提议并说明依据与前提条件，不得写成已核定、已批准或已生效的决定；不得输出投资建议；债券评级只能引用材料已披露的结果。
  terminology: 统一使用发行人、债券、保证人、反担保、偿债来源、募集资金专户、兑付、受托管理人、持有人会议等债券担保术语；不得混用贷款业务术语。
chapters:
  scope:
    llm: false
    role: ""
    goal: 由固定模板生成：明确审查对象与范围、核心材料齐备状态和报告使用边界。
    required_inputs: [project, inventory]
    required_sections: [审查范围, 材料状态, 使用边界]
    preserve_blocks: []
    rules: []
    forbidden: []
  bond_overview:
    llm: false
    role: 债券担保尽调执笔人
    goal: 汇总募集说明书所载债券发行条款和拟议担保交易结构，作为后续章节的入口。
    required_inputs: [project, bond_facts, sources]
    required_sections: [发行条款, 增信结构, 审查边界]
    preserve_blocks: [拟议保证声明, 募集说明书披露归属, 材料不足声明]
    rules:
      # P0-3：成品旧称统一由服务端规范化，模型不再被要求逐字写“据募集说明书披露”。
      - 债券发行条款（规模、期限、票面利率、付息频率、还本方式）只能引用发行文件披露值。
      - 保证人、保证范围须标注“拟议”，强调须以签署版保证合同核验，不得表述为保证责任已生效。
    forbidden:
      - 不得把募集说明书的拟议安排描述为已确认事实。
      - 不得把承保或担保定价写成已作出的决定（可以给出待复核的建议，须说明依据与前提）。
    input_contract:
      fact_keys: [bond_name, bond_issue_amount, registered_issue_amount, bond_term_years, coupon_rate, interest_frequency, principal_repayment, guarantor_name, guarantee_scope, guarantee_period, guarantee_cap]
      metric_keys: []
      rule_keys: [bond_term_consistency, rating_consistency, guarantee_scope]
      source_kinds: [募集说明书, 信用评级报告, 担保合同]
      max_evidence_items: 12
      max_evidence_chars: 18000
    output_contract:
      # P0-3：移除“据募集说明书披露”强制项，保留其余必需表述；“拟议”仍是保证声明边界。
      required_phrases: [拟议]
      required_missing_markers: [材料不足]
      forbidden_patterns: [投资建议]
      attribution_mode: prospectus
  governance:
    llm: true
    generation_mode: generate
    role: 发行主体审查员
    goal: 梳理发行人主体、股权、实际控制人和治理材料所载信息，识别待核验的治理与关联方事项。
    required_inputs: [facts, sources, cross_checks]
    required_sections: [主体及控制关系, 治理核验边界]
    preserve_blocks: [材料不足声明, 待核验声明, 事实冲突]
    rules:
      - 股权、实控人和治理信息只能描述募集说明书所载内容，不得表述为已经工商或征信外部核验。
      - 关联方往来只引用规则结果，区分有合同支持、无合同支持和材料不足。
    forbidden:
      - 不得推断股权比例、实控人关系或公司治理有效性。
    # governance 从确定性模板改为模型直接撰写（第三点细化方案 §三.1：第一章新默认目标
    # 2000–4000 字符；项目覆盖、已有全局篇幅配置与历史报告保留）。
    # 不写 paragraph_order：修订稿要求"移除系统另行强制的正文顺序"，结构交给
    # required_sections 与项目 Prompt。
    narrative_contract:
      tone: professional_due_diligence
      min_paragraphs: 3
      max_paragraphs: 5
      preferred_min_chars: 2000
      preferred_max_chars: 4000
      list_mode: limited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
    input_contract:
      fact_keys: [controller, controller_share, related_parties, related_unsupported_amount]
      metric_keys: []
      rule_keys: [related_party]
      source_kinds: [募集说明书, 企业信息, 治理材料, 关联方]
      max_evidence_items: 12
      max_evidence_chars: 18000
    output_contract:
      # P0-3：模型与成品契约不再要求逐字输出旧称。
      required_phrases: []
      required_missing_markers: [材料不足, 待核验]
      forbidden_patterns: [投资建议]
      attribution_mode: prospectus
  operations:
    llm: true
    # 按 PLAN_new_p0_p1.md P0-2 / PLAN.md P0-B：第一部分经营章同 governance 切为模型直接撰写。
    generation_mode: generate
    role: 经营分析员
    goal: 基于募集说明书和访谈材料分析主营业务、上下游集中度与经营持续性。
    required_inputs: [facts, sources, cross_checks]
    required_sections: [经营与集中度事实, 审查边界]
    preserve_blocks: [集中度核验状态, 材料不足声明]
    rules:
      - 经营持续性、在手订单和产能只能依据材料中明确出现的事实；缺失时生成待核验任务而非补写结论。
    forbidden:
      - 不得虚构订单、产能、市场份额或客户稳定性。
    # 篇幅目标与 governance 对齐：2000–4000 字符；不写 paragraph_order，结构交给
    # required_sections 与项目 Prompt。
    narrative_contract:
      tone: professional_due_diligence
      min_paragraphs: 3
      max_paragraphs: 5
      preferred_min_chars: 2000
      preferred_max_chars: 4000
      list_mode: limited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
    input_contract:
      fact_keys: [main_business, top_customer_share, top5_customer_share, top_supplier_share, top5_supplier_share, order_backlog, capacity_utilization]
      metric_keys: []
      rule_keys: [customer_concentration, supplier_concentration, revenue_cash_quality]
      source_kinds: [募集说明书, 合同订单, 访谈纪要]
      max_evidence_items: 12
      max_evidence_chars: 18000
    output_contract:
      # P0-3：移除“据募集说明书披露”强制项。
      required_phrases: []
      required_missing_markers: [材料不足, 待核验]
      forbidden_patterns: [投资建议]
      attribution_mode: prospectus
  proceeds:
    llm: true
    # 按 PLAN_new_p0_p1.md P0-2 / PLAN.md P0-B：募集资金用途章同 governance 切为模型直接撰写。
    generation_mode: generate
    role: 募集资金用途核验员
    goal: 核验募集资金金额、用途和专户安排的合规性及闭环证据。
    required_inputs: [facts, checks, sources]
    required_sections: [募集资金用途, 专户及核验边界]
    preserve_blocks: [用途核验状态, 专户声明, 材料不足声明]
    rules:
      - 募集资金金额与用途只能引用披露值；专户信息未提供时写“材料不足，待补充专户协议”。
      - 用途与偿债安排须区分“募集资金专户”与“偿债账户”，不得混用。
    forbidden:
      - 不得推断募集资金实际流向或虚构用途闭环。
    # 篇幅目标与 governance 对齐：2000–4000 字符；不写 paragraph_order。
    narrative_contract:
      tone: professional_due_diligence
      min_paragraphs: 3
      max_paragraphs: 5
      preferred_min_chars: 2000
      preferred_max_chars: 4000
      list_mode: limited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
    input_contract:
      fact_keys: [proceeds_amount, proceeds_purpose, repayment_account, supporting_contract_amount]
      metric_keys: []
      rule_keys: [proceeds_coverage]
      source_kinds: [募集说明书, 募集资金用途, 银行流水, 合同订单]
      max_evidence_items: 12
      max_evidence_chars: 18000
    output_contract:
      # P0-3：移除“募集说明书披露”强制项。
      required_phrases: []
      required_missing_markers: [材料不足, 材料未披露]
      forbidden_patterns: [投资建议]
      attribution_mode: prospectus
  financial:
    llm: true
    generation_mode: generate
    calculation_mode: model
    role: 财务分析员
    goal: 基于项目冻结主体档案、募集说明书和评级报告的三个完整年度事实，归纳财务结构、盈利质量和应收质量。
    required_inputs: [facts, metrics, cross_checks]
    required_sections: [财务概览, 财务结构与核验, 审查边界]
    preserve_blocks: [材料不足声明, 勾稽状态, 规则状态]
    rules:
      - 只使用上下文列明的三个完整年度及统一报表口径；不得混用季度、半年度、合并和母公司口径。
      - 主体档案、募集说明书、评级报告和系统计算必须分别归属，不得把评级观点写成事实。
      - 未取得审计报告原件时，明确标注“披露信息待核验”，不得表述为审计确认。
      - 本章的数据表由系统生成并原样附在正文中；正文只写分析，按“重要变化—对偿债来源的影响范围—具体核验动作”组织。
      - 正文不得逐行复述表内数字；需要指代变化时引用已给出的指标或事实，不另行罗列科目金额。
    forbidden:
      - 不得自创财务科目，不得把无依据的趋势或原因写成结论；自主计算的指标须按 calculations 契约声明并由系统复算。
      - 不得改动、重排或重算系统数据表中的任何数值、年度与表注。
      - 不得为变化编造原因；缺乏底稿支持的原因只能写成待核验事项。
      - 不得把冻结主体档案的事实汇总表述为已完成的独立核验。
    input_contract:
      fact_keys: [revenue, cost_of_goods_sold, net_profit, operating_cash_flow, cash_received_from_sales, accounts_receivable, other_receivables, total_overdue_receivables, inventory, cash, restricted_cash, total_assets, total_liabilities, equity, current_assets, current_liabilities, finance_expense, interest_expense]
      # 计划 §三 新增指标白名单：周转率（次，期初期末平均余额）、结构占比、三年速动比率。
      # `quick_ratio` 此前不在白名单里，正文写"三年均低于1倍"时只有 comparison_bound 可依；
      # 补齐后三年速动比率成为**可引用的系统指标**。
      metric_keys: [revenue_growth, net_margin, cash_profit_ratio, debt_ratio, current_ratio, quick_ratio, available_cash, cash_short_debt_ratio, interest_bearing_debt_capitalization, receivables_revenue_ratio, operating_cashflow_debt_ratio, ar_turnover, inventory_turnover, non_current_assets_ratio, non_current_liabilities_ratio]
      rule_keys: [financial_tie_out, leverage_liquidity, receivable_quality, revenue_cash_quality, interest_coverage]
      source_kinds: [募集说明书, 审计报告, 财务报表, 信用评级报告]
      max_evidence_items: 16
      max_evidence_chars: 22000
    output_contract:
      required_phrases: [披露信息待核验]
      required_missing_markers: [材料不足, 披露信息待核验]
      forbidden_patterns: [投资建议]
      # 财务章试点（计划 §二）：引用上限 3 → 8。财务分析引用处多（合并资产负债表、
      # 利润表、现金流量表、有息债务表各要点），3 条会把合法引用截断成"论据不全"。
      # 超量引用只做去重与截断（`workflow._limit_chapter_citations`），**不作为事实失败理由**。
      attribution_mode: multi_source_financial
    narrative_contract:
      tone: professional_due_diligence
      paragraph_order: [财务概览, 三年趋势与结构, 对偿债来源的影响, 审查边界与待核验事项]
      min_paragraphs: 3
      max_paragraphs: 5
      preferred_min_chars: 550
      preferred_max_chars: 1800
      list_mode: limited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
  cashflow:
    llm: true
    generation_mode: generate
    calculation_mode: model
    role: 偿债来源分析员
    goal: 分析经营现金流、第一偿债来源和偿债现金流预测的可靠性。
    required_inputs: [facts, metrics, sources]
    required_sections: [第一偿债来源, 历史现金流与预测, 兑付安排与审查边界]
    preserve_blocks: [预测归因声明, 勾稽声明, 材料不足声明]
    rules:
      - 第一偿债来源优先引用材料明确的偿债安排；经营现金流只能作为支撑分析，不能代替偿债安排。
      - 历史现金流只使用三个完整年度；现金转化与偿债覆盖等指标以系统预计算为准，如需另算须按 calculations 契约声明并由系统复算。
      - 偿债现金流预测值只引用确定性值，并注明“预测值须与银行流水、订单回款和偿债专户逐期勾稽”。
    forbidden:
      - 不得把经营性现金流预测直接等同于可偿付现金。
    input_contract:
      fact_keys: [cash_received_from_sales, operating_cash_flow, investing_cash_flow, financing_cash_flow, operating_cashflow_forecast, repayment_source, repayment_account, proceeds_amount]
      metric_keys: [cash_profit_ratio, operating_cashflow_debt_ratio, dscr]
      rule_keys: [cashflow_debt_service, bullet_maturity, revenue_cash_quality]
      source_kinds: [募集说明书, 信用评级报告, 审计报告, 财务报表, 银行流水, 偿债安排]
      max_evidence_items: 14
      max_evidence_chars: 20000
    output_contract:
      # P0-3：移除“募集说明书披露”强制项；成品旧称由服务端统一规范化。
      required_phrases: []
      required_missing_markers: [材料不足, 待核验]
      forbidden_patterns: [投资建议, 可偿付现金]
      attribution_mode: repayment
    narrative_contract:
      tone: professional_due_diligence
      paragraph_order: [第一偿债来源, 历史现金流与预测, 对本期债券兑付的影响, 逐期勾稽边界]
      min_paragraphs: 3
      max_paragraphs: 5
      preferred_min_chars: 480
      preferred_max_chars: 1600
      list_mode: limited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
  debt:
    llm: true
    generation_mode: generate
    calculation_mode: model
    role: 债务结构分析员
    goal: 分析发行人债务结构、到期集中度和本期债券偿付压力。
    required_inputs: [facts, checks, metrics]
    required_sections: [债务概览, 本期债券兑付影响, 审查边界]
    preserve_blocks: [到期集中度核验状态, 材料不足声明]
    rules:
      - 有息债务、到期债务和利息支出只能引用确定性值。
      - 三年债务结构必须按同一报表口径展示；禁止用募集说明书总规模替代发行人存量债务。
      - 本期债券一次还本的偿付计划须单独说明，且只引用材料中出现的安排。
    forbidden:
      - 不得推断续融资可行性或授信获批概率。
    input_contract:
      fact_keys: [short_term_debt, debt_due_12m, long_term_debt, bonds_payable, interest_bearing_debt, interest_expense, bond_issue_amount, principal_repayment]
      metric_keys: [dscr, debt_ratio, current_ratio, available_cash, cash_short_debt_ratio, interest_bearing_debt_capitalization, operating_cashflow_debt_ratio]
      rule_keys: [debt_maturity, bullet_maturity, leverage_liquidity]
      source_kinds: [募集说明书, 信用评级报告, 审计报告, 财务报表, 债务明细, 偿债安排]
      max_evidence_items: 14
      max_evidence_chars: 20000
    output_contract:
      # P0-3：移除“募集说明书披露”强制项；成品旧称由服务端统一规范化。
      required_phrases: []
      required_missing_markers: [材料不足, 待核验]
      forbidden_patterns: [授信获批]
      attribution_mode: prospectus
    narrative_contract:
      tone: professional_due_diligence
      paragraph_order: [债务概览, 到期压力, 对本期债券兑付的影响, 台账与材料边界]
      min_paragraphs: 3
      max_paragraphs: 5
      preferred_min_chars: 480
      preferred_max_chars: 1600
      list_mode: limited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
  rating:
    llm: true
    generation_mode: generate
    calculation_mode: model
    role: 评级报告复核员
    goal: 复核主体评级、债项评级、展望和评级关注因素，但明确评级意见的边界。
    required_inputs: [rating_facts, sources]
    required_sections: [评级结论, 评级关注因素, 使用边界]
    preserve_blocks: [评级边界声明, 材料不足声明]
    rules:
      - 评级结果和关注因素只引用评级报告原文。
      - 评级报告中的调整后财务数据必须标识为评级口径，不得覆盖主体档案或募集说明书数值。
      - 必须保留“评级机构意见不等同于担保机构独立判断”的边界声明。
      # 2026-10-19 第五轮实测（华辰 rating）：模型把第三段写成"拟议增信条款复核"，
      # 引用保证额度/反担保折后价值/覆盖率——这些属保证与反担保章，本章输入契约里
      # 根本没有对应事实，必然判成"章节数字与所写科目不匹配"而整章回退。
      - 不得复核、复述或引用拟议增信条款的具体数值（保证额度、反担保折后价值、覆盖率、顺位等属保证与反担保章节）；本节只说明评级意见的适用边界。
    forbidden:
      - 不得复述或强化评级下调理由作为担保判断依据。
      - 不得自行评定债券评级或输出投资建议（评级只能引用材料已披露的结果）。
    input_contract:
      fact_keys: [issuer_rating, bond_rating, rating_outlook, rating_agency, rating_date, rating_downgrade_trigger, rating_revenue, rating_total_debt, rating_issue_amount]
      metric_keys: []
      rule_keys: [rating_consistency, financial_tie_out]
      source_kinds: [信用评级报告]
      max_evidence_items: 12
      max_evidence_chars: 18000
    output_contract:
      required_phrases: [评级机构认为, 不等同于担保机构独立判断]
      required_missing_markers: [材料不足, 材料未披露]
      # 2026-10-20 第七轮复核：只加 rules 措辞不够——模型首稿与修复稿都写了
      # "拟议保证范围…责任上限23,000万元；拟议反担保折后价值16,000万元…"。
      # 评级章的 source_kinds 只有信用评级报告，不含增信条款，写出来必然判归属冲突；
      # 这里升级为硬禁词，逼它在唯一一次修复里删掉（而不是靠 needs_review 兜）。
      forbidden_patterns: [投资建议, 担保机构认为, 拟议保证范围, 反担保折后价值]
      attribution_mode: rating
    narrative_contract:
      tone: professional_due_diligence
      paragraph_order: [评级结论, 评级关注因素, 评级意见的适用边界]
      min_paragraphs: 3
      max_paragraphs: 4
      preferred_min_chars: 380
      preferred_max_chars: 1300
      list_mode: prohibited
      avoid_openings: [系统识别到, 规则状态为, 经模型分析]
      prohibited_terms: [warning, insufficient, rule_key, 字段]
  investor_protection:
