name: Repository Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    env:
      APP_DATA_DIR: .data-ci
      PYTHONIOENCODING: utf-8
      LLM_API_KEY: ""
      OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_public_release.py
      - name: Core Regression (No Private PDF Fixtures)
        run: python -m pytest tests/test_public_release.py tests/test_parsers.py tests/test_fact_extraction_guards.py tests/test_table_block.py tests/test_llm.py tests/test_project_boundaries.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
